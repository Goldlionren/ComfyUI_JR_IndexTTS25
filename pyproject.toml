[project]
name = "comfyui-jr-indextts25"
version = "0.5.1"
description = "Native IndexTTS-2.5 nodes for ComfyUI on Python 3.12/3.13 with NVIDIA CUDA or Intel XPU"
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["comfyui", "indextts", "tts", "voice-cloning", "audio"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Repository = "https://github.com/Goldlionren/ComfyUI_JR_IndexTTS25"
Issues = "https://github.com/Goldlionren/ComfyUI_JR_IndexTTS25/issues"

[tool.comfy]
DisplayName = "ComfyUI JR IndexTTS 2.5"
